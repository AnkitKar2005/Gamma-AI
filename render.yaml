services:
  # -------------------------
  # 1. FastAPI Backend Service
  # -------------------------
  - type: web
    name: gamma-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: gamma-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gamma-redis
          property: connectionString
      # Add your real API keys in the Render UI dashboard later
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # -------------------------
  # 2. Next.js Frontend Service
  # -------------------------
  - type: web
    name: gamma-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_WS_URL
        # This dynamically tells the frontend to connect to the backend URL above
        # The exact WSS URL will need to be configured in the UI or updated once the backend renders.
        # But this acts as a placeholder
        value: wss://gamma-api.onrender.com/ws

  # -------------------------
  # 3. Redis Service
  # -------------------------
  - type: redis
    name: gamma-redis
    ipAllowList: [] # internal connections only
    plan: free

databases:
  # -------------------------
  # 4. PostgreSQL Database
  # -------------------------
  - name: gamma-postgres
    databaseName: gammadb
    user: gammauser
    plan: free
