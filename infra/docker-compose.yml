version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamma_db
      POSTGRES_USER: gamma_user
      POSTGRES_PASSWORD: gamma_secret
    ports:
      - "5432:5432"
    volumes:
      - gamma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamma_user -d gamma_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamma-network

  redis:
    image: redis:7-alpine
    container_name: gamma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gamma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamma-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: gamma-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - gamma_chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamma-network

volumes:
  gamma_pgdata:
  gamma_redis_data:
  gamma_chroma_data:

networks:
  gamma-network:
    driver: bridge
