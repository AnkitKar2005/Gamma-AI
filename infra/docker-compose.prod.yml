version: "3.9"

services:
  # ── Data Stores ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gamma-postgres
    restart: always
    environment:
      POSTGRES_DB: gamma_db
      POSTGRES_USER: gamma_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamma_secret}
    volumes:
      - gamma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamma_user -d gamma_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - gamma-network

  redis:
    image: redis:7-alpine
    container_name: gamma-redis
    restart: always
    volumes:
      - gamma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - gamma-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: gamma-chromadb
    restart: always
    volumes:
      - gamma_chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - gamma-network

  # ── Application ─────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: gamma-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://gamma_user:${POSTGRES_PASSWORD:-gamma_secret}@postgres:5432/gamma_db
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - gamma-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: gamma-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_WS_URL: ws://backend:8080/ws
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - gamma-network

  # ── Reverse Proxy ───────────────────────
  nginx:
    image: nginx:alpine
    container_name: gamma-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - gamma-network

volumes:
  gamma_pgdata:
  gamma_redis_data:
  gamma_chroma_data:

networks:
  gamma-network:
    driver: bridge
